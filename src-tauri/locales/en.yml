_version: 1
app:
  nombre: Mail
ventana:
  minimizar: Minimise
  maximizar: Maximise
  cerrar: Close
adjuntar:
  boton: Attach
  titulo: Choose files to attach
  sacar: Remove this file

atajos:
  titulo: Keyboard shortcuts
  cerrar: Close
  nota: "Shortcuts do not fire while you are typing in a field."
  siguiente: Next message
  anterior: Previous message
  abrir: Open the first one
  volver: Back to the list
  responder: Reply
  archive: Archive
  delete: Move to trash
  redactar: Write a new one
  actualizar: Refresh
  irALaEntrada: Go to the inbox
  buscar: Jump to search
  ayuda: Show this list

buscar:
  campo: Search mail
  preguntando: Asking the server…
  # Saying what is on screen is not cosmetic: without it the list changes
  # meaning with no warning, and someone concludes a message does not exist
  # when it is simply further back.
  soloLoQueEsta: "Only what is already here. Enter searches the server."
  delServidor: Results from the server.

casillas:
  titulo: Folders
  # Names for the folders we recognise. An English server says "Sent" and a
  # Spanish one "Elementos enviados"; the same folder being called different
  # things per provider is noise. Ones we do not recognise keep the name
  # whoever created them gave them, which is the right one.
  entrada: Inbox
  enviados: Sent
  borradores: Drafts
  papelera: Trash
  spam: Junk
  archivo: Archive
  todo: All mail

cuentas:
  todas: All accounts
  titulo: Accounts
  sinCuentasTitulo: No mailboxes yet
  sinCuentasDescripcion: Connect a mail account from Settings and its messages will show up here.
  sinLeerOne: "{0} unread"
  sinLeerOther: "{0} unread"
  noSePudo: This account could not be read
lista:
  cargando: Looking for mail…
  actualizar: Refresh
  vacia: Nothing in this mailbox
  sinAsunto: (no subject)
  sinFecha: No date
  conAdjuntos: Has an attachment
  noLeido: Unread
mensaje:
  archivar: Archive
  borrar: Delete
  sinArchivo: "This account has no archive folder on the server."
  quedoElOriginal: "It was copied, but the server didn't let the original be removed from the folder: it may show up in both."
  guardar: Save
  guardando: Saving…
  guardadoEn: "Saved to {0}"
  guardadoCortado: "Saved, but the file was larger than what gets downloaded and may be incomplete."
  mostrarImagenes: "Show"
  trayendoImagenes: "Fetching…"
  imagenesQueFallaron: "Could not fetch {0} image(s)."
  cuerpo: "Message body"
  verTextoPelado: "View as plain text"
  verConFormato: "View formatted"
  imagenesBloqueadas: "This message wants to load {0} image(s) from an external server. They were not loaded: fetching them would tell the sender you opened it."
  volver: Back
  elegiUno: Pick a message to read it
  de: From
  cuando: When
  marcarLeido: Mark as read
  recortado: There is more to this message. This version only fetches the beginning.
  adjuntos: "This message has attachments. This version names them, and does not open them yet:"
  soloTexto: The message text is shown. Formatting and images are not loaded.
preferencias:
  deshacer: "Time to undo a send"
  deshacerPorQue: "How long a message waits after you hit Send. You can cancel it in that time."
  segundos: "{0} s"
  sinEspera: "No wait"
  titulo: Preferences
  cerrar: Close
  cartel: The new-mail card
  cartelPorQue: >-
    The screen can be locked, shared or projected. Who writes to you is as
    personal as what they wrote, so by default the card names nobody.
  cuenta: Only how many arrived and to which account
  remitente: Also who sent it
  remitente_y_asunto: Also what it is about
  vista: How a message opens
  vistaPorQue: >-
    The plain-text view never goes away: it is still on every message, and it is
    the one to use when a message looks odd or when you do not trust who sent
    it.
  vista_formato: Formatted
  vista_texto: As plain text
  atajos: Keyboard shortcuts
  atajosPorQue: "The full list is shown with the ? key"
  atajos_gmail: Gmail style
  atajos_vim: Vim style
  conVarios: >-
    With more than one message the card names none of them: it would say one
    and stay quiet about the rest.

mailto:
  # Shown when a `mailto:` link asked for a blind copy: neither the compose
  # window nor the service that builds the message support `Bcc` yet.
  sinCopiaOculta: The link asked for a blind copy, which cannot be sent yet. Everything else was filled in.

redactar:
  nuevo: Write
  responder: Reply
  titulo: New message
  tituloRespuesta: Reply
  desde: From
  para: To
  cc: Cc
  asunto: Subject
  cuerpo: Message
  variasDirecciones: Separate several with commas
  enviar: Send
  enviando: Adding to the queue…
  cancelar: Cancel
  citado: "On {0}, {1} wrote:"
  seEncola: The message is saved and goes out as soon as it can. You can close this window.
  descartarBorrador: Discard what you wrote?
  firmar: Sign with S/MIME
  firmarPorQue: With your certificate. Without one for this account, the message will not go out.
  firmarSinCertificado: Import this account's certificate in Preferences to be able to sign.
  respuestaACifrado: You are replying to an encrypted message. The reply quotes its text and goes out unencrypted.
smime:
  # `{0}` is the address of the certificate that signed. Never "valid": what was
  # checked is the signature, not that an authority vouches for the certificate.
  firmadoNoVerificado: "Signed, not verified — {0}"
  firmaTitulo: Unverified signature
  firmaPorQue: >-
    The signature is intact and matches the sender, but nobody checked that a
    trusted authority issued the certificate. It tells you the message was not
    changed, not who it really is from.
  cifrado: Encrypted
  cifradoPorQue: The message arrived encrypted and was opened with your certificate.
  noSePudoAbrir: Encrypted, could not be opened
  noSePudoAbrirPorQue: >-
    It may be encrypted for another certificate, or with a method that is not
    supported yet. If the message has a smime.p7m file, save it and open it with
    another program.
  cuerpoNoDisponible: >-
    This message is encrypted or signed with S/MIME. The body is not available
    in this view yet.
  # Importing each account's identity (certificate with its key), in Preferences.
  seccion: S/MIME
  seccionPorQue: >-
    The certificate with its private key, in a .p12 or .pfx file. It is stored
    encrypted in the system and is used to sign that account's messages.
  elegir: Choose .p12 file
  elegirTitulo: Choose the certificate
  filtro: Certificate (.p12, .pfx)
  contrasena: File password
  importar: Import
  quitar: Remove
  ausente: This account does not have a certificate to sign with yet.
  # `{0}` is the date the certificate expires.
  vence: "expires on {0}"
  errorWrongPassword: The password does not open the certificate.
  errorTooBig: The file is larger than allowed (8 MiB).
  errorAddressMismatch: The certificate is not for this account's address.
  errorUnsupportedLegacy: The .p12 uses legacy encryption; re-export it without the -legacy option.
  errorMalformed: The .p12 could not be read (is it not a PFX, or is the key missing?).
  errorKeyringLocked: The keyring is locked; unlock it and try again.
  errorFailed: The operation with the certificate could not be completed.

deshacer:
  # `{0}` is the seconds left.
  enCamino: "Message on its way… {0}s"
  boton: Undo

programar:
  boton: Schedule
  titulo: Choose when it goes out
  estaTarde: This evening
  mananaTemprano: Tomorrow morning
  elLunes: Monday morning
  aMano: Or pick the date and time
  confirmar: Schedule it

salida:
  titulo: Not sent
  esperandoOne: "{0} waiting to go out"
  esperandoOther: "{0} waiting to go out"
  trabado: Could not be sent
  reintentandoOne: "{0} attempt"
  reintentandoOther: "{0} attempts"
  esperandoSuHora: Waiting for the time you asked for
  descartar: Discard
  confirmarDescartar: What you wrote will be lost. Discard it anyway?
  sinAsunto: (no subject)
sync:
  pending: Waiting to sync
  syncing: Syncing…
  synced: Up to date
  syncedAt: "Up to date · {0}"
  failed: "Could not sync: {0}"
  unavailable: "Not available: {0}"
  request:
    denied: You did not allow syncing this account
    too_soon: Just refreshed; you can refresh again in a moment
    unavailable: The sync service is not running
    failed: Could not request a sync
# El estado de «sin permiso» para leer el correo del almacén, con el botón que
# vuelve a abrir el diálogo. Ver `src/tools/store-permission.ts`.
permiso:
  titulo: No permission to see your mail
  descripcion: You have not allowed reading the mail stored on the system. Ask for it again to bring the dialog back.
  pedir: Ask for permission again
  # Cuando no se pudo ni volver a pedir el permiso.
  limite: You just asked a moment ago; wait a minute and try again.
  denegado: This permission cannot be requested again.
  error: Could not ask for the permission again.
