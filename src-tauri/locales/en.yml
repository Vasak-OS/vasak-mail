buscar:
  campo: Search mail
  preguntando: Asking the server…
  # Saying what is on screen is not cosmetic: without it the list changes
  # meaning with no warning, and someone concludes a message does not exist
  # when it is simply further back.
  soloLoQueEsta: "Only what is already here. Enter searches the server."
  delServidor: Results from the server.

casillas:
  titulo: Folders
  # Names for the folders we recognise. An English server says "Sent" and a
  # Spanish one "Elementos enviados"; the same folder being called different
  # things per provider is noise. Ones we do not recognise keep the name
  # whoever created them gave them, which is the right one.
  entrada: Inbox
  enviados: Sent
  borradores: Drafts
  papelera: Trash
  spam: Junk
  archivo: Archive
  todo: All mail

cuentas:
  todas: All accounts
  titulo: Accounts
  sinCuentasTitulo: No mailboxes yet
  sinCuentasDescripcion: Connect a mail account from Settings and its messages will show up here.
  sinLeerOne: "{0} unread"
  sinLeerOther: "{0} unread"
  noSePudo: This account could not be read
lista:
  cargando: Looking for mail…
  actualizar: Refresh
  vacia: Nothing in this mailbox
  sinAsunto: (no subject)
  sinFecha: No date
  conAdjuntos: Has an attachment
  noLeido: Unread
mensaje:
  guardar: Save
  guardando: Saving…
  guardadoEn: "Saved to {0}"
  guardadoCortado: "Saved, but the file was larger than what gets downloaded and may be incomplete."
  mostrarImagenes: "Show"
  trayendoImagenes: "Fetching…"
  imagenesQueFallaron: "Could not fetch {0} image(s)."
  cuerpo: "Message body"
  verTextoPelado: "View as plain text"
  verConFormato: "View formatted"
  imagenesBloqueadas: "This message wants to load {0} image(s) from an external server. They were not loaded: fetching them would tell the sender you opened it."
  volver: Back
  elegiUno: Pick a message to read it
  de: From
  cuando: When
  marcarLeido: Mark as read
  recortado: There is more to this message. This version only fetches the beginning.
  adjuntos: "This message has attachments. This version names them, and does not open them yet:"
  soloTexto: The message text is shown. Formatting and images are not loaded.
preferencias:
  deshacer: "Time to undo a send"
  deshacerPorQue: "How long a message waits after you hit Send. You can cancel it in that time."
  segundos: "{0} s"
  sinEspera: "No wait"
  titulo: Preferences
  cerrar: Close
  cartel: The new-mail card
  cartelPorQue: >-
    The screen can be locked, shared or projected. Who writes to you is as
    personal as what they wrote, so by default the card names nobody.
  cuenta: Only how many arrived and to which account
  remitente: Also who sent it
  remitente_y_asunto: Also what it is about
  vista: How a message opens
  vistaPorQue: >-
    The plain-text view never goes away: it is still on every message, and it is
    the one to use when a message looks odd or when you do not trust who sent
    it.
  vista_formato: Formatted
  vista_texto: As plain text
  atajos: Keyboard shortcuts
  atajosPorQue: "The full list is shown with the ? key"
  atajos_gmail: Gmail style
  atajos_vim: Vim style
  conVarios: >-
    With more than one message the card names none of them: it would say one
    and stay quiet about the rest.

