_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Lo verifica `tests/catalogos.test.ts`.
app:
  nombre: Correo
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar
adjuntar:
  boton: Adjuntar
  titulo: Elegir archivos para adjuntar
  sacar: Sacar este archivo

atajos:
  titulo: Atajos de teclado
  cerrar: Cerrar
  nota: "Los atajos no se disparan mientras se escribe en un campo."
  siguiente: Mensaje siguiente
  anterior: Mensaje anterior
  abrir: Abrir el primero
  volver: Volver a la lista
  responder: Responder
  redactar: Escribir uno nuevo
  actualizar: Actualizar
  irALaEntrada: Ir a la bandeja de entrada
  ayuda: Ver esta lista

buscar:
  campo: Buscar en el correo
  preguntando: Preguntándole al servidor…
  # Decir qué se está mostrando no es cosmético: sin esto la lista cambia de
  # significado sin aviso, y alguien concluye que un mensaje no existe cuando lo
  # que pasa es que está más atrás.
  soloLoQueEsta: "Sólo lo que ya está acá. Enter busca en el servidor."
  delServidor: Resultados del servidor.

casillas:
  titulo: Carpetas
  # Los nombres de las carpetas conocidas. Un servidor en inglés dice «Sent» y
  # uno en español «Elementos enviados»; que la misma carpeta se llame distinto
  # según el proveedor es ruido. Las que no se reconocen se muestran con el
  # nombre que les puso quien las creó, que es el correcto.
  entrada: Entrada
  enviados: Enviados
  borradores: Borradores
  papelera: Papelera
  spam: Correo no deseado
  archivo: Archivo
  todo: Todo el correo

cuentas:
  todas: Todas las cuentas
  titulo: Cuentas
  sinCuentasTitulo: Todavía no hay ninguna casilla
  sinCuentasDescripcion: Conectá una cuenta de correo desde Configuración y sus mensajes aparecen acá.
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  sinLeerOne: "{0} sin leer"
  sinLeerOther: "{0} sin leer"
  noSePudo: No se pudo leer esta cuenta
lista:
  cargando: Buscando correo…
  actualizar: Actualizar
  vacia: No hay nada en esta casilla
  sinAsunto: (sin asunto)
  sinFecha: Sin fecha
  conAdjuntos: Trae un archivo
  noLeido: Sin leer
mensaje:
  guardar: Guardar
  guardando: Guardando…
  guardadoEn: "Guardado en {0}"
  guardadoCortado: "Se guardó, pero el archivo era más grande de lo que se baja y puede estar incompleto."
  mostrarImagenes: "Mostrar"
  trayendoImagenes: "Trayendo…"
  imagenesQueFallaron: "No se pudieron traer {0} imagen(es)."
  cuerpo: "Cuerpo del mensaje"
  verTextoPelado: "Ver sin formato"
  verConFormato: "Ver con formato"
  imagenesBloqueadas: "Este mensaje quiere cargar {0} imagen(es) de un servidor externo. No se cargaron: pedirlas le avisaría a quien lo mandó que lo abriste."
  volver: Volver
  elegiUno: Elegí un mensaje para leerlo
  de: De
  cuando: Cuándo
  marcarLeido: Marcar como leído
  # Se dice, en vez de dejar el texto terminado a la mitad sin explicación.
  recortado: El mensaje sigue. Esta versión trae sólo el principio.
  # Y esto también: quien lee un mensaje y no se entera de que traía un archivo,
  # pierde el archivo.
  adjuntos: "Este mensaje trae archivos adjuntos. Esta versión los nombra, y todavía no los abre:"
  soloTexto: Se muestra el texto del mensaje. El formato y las imágenes no se cargan.
preferencias:
  titulo: Preferencias
  cerrar: Cerrar
  cartel: El cartel de correo nuevo
  cartelPorQue: >-
    La pantalla puede estar bloqueada, compartida o proyectada. Quién te escribe
    es un dato tan personal como lo que te escribió, así que por omisión el
    cartel no nombra a nadie.
  cuenta: Sólo cuántos llegaron y a qué cuenta
  remitente: También quién lo mandó
  remitente_y_asunto: También de qué se trata
  vista: Con qué se abre un mensaje
  vistaPorQue: >-
    La vista de texto no desaparece nunca: sigue estando en cada mensaje, y es
    la que sirve cuando uno se ve raro o cuando no se le tiene confianza a quien
    lo mandó.
  vista_formato: Con formato
  vista_texto: Como texto
  atajos: Atajos de teclado
  atajosPorQue: "La lista completa se ve con la tecla ?"
  atajos_gmail: Estilo Gmail
  atajos_vim: Estilo Vim
  conVarios: >-
    Con más de un mensaje el cartel no nombra a ninguno: diría el de uno y
    callaría los otros.

redactar:
  nuevo: Escribir
  responder: Responder
  titulo: Mensaje nuevo
  tituloRespuesta: Responder
  desde: Desde
  para: Para
  cc: Cc
  asunto: Asunto
  cuerpo: Mensaje
  # Varias direcciones separadas por coma; el punto y coma también sirve.
  variasDirecciones: Separá varias con comas
  enviar: Enviar
  enviando: Poniendo en la cola…
  cancelar: Cancelar
  # `t()` no interpola: el marcador se reemplaza a mano. Ver el README.
  citado: "El {0}, {1} escribió:"
  # Se dice porque no es obvio y cambia lo que la persona espera del botón.
  seEncola: El mensaje se guarda y sale en cuanto se pueda. Podés cerrar la ventana.
  descartarBorrador: ¿Descartar lo que escribiste?
deshacer:
  # `{0}` son los segundos que quedan.
  enCamino: "Mensaje en camino… {0} s"
  boton: Deshacer

programar:
  boton: Programar
  titulo: Elegir cuándo sale
  estaTarde: Esta tarde
  mananaTemprano: Mañana a la mañana
  elLunes: El lunes a la mañana
  aMano: O elegí la fecha y la hora
  confirmar: Programar el envío

salida:
  titulo: Sin enviar
  # `t()` no interpola. Ver el README.
  esperandoOne: "{0} esperando salir"
  esperandoOther: "{0} esperando salir"
  trabado: No se pudo enviar
  reintentandoOne: "{0} intento"
  reintentandoOther: "{0} intentos"
  esperandoSuHora: Esperando la hora que pediste
  descartar: Descartar
  confirmarDescartar: Se pierde lo que escribiste. ¿Descartarlo igual?
  sinAsunto: (sin asunto)
