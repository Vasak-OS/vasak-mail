[package]
name = "vasak-mail"
version = "0.15.1"
description = "El correo de VasakOS"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Para abrir la ventana compilada sin el servidor de desarrollo detrás.
#
# En depuración y sin esto, el WebView carga el `devUrl` de `tauri.conf.json`:
# si no hay nada sirviendo ahí, la ventana abre **vacía**, sin error, sin
# registro y sin nada que mirar.
#
# El nombre corto es el que documenta Tauri y el que usa el resto del
# escritorio, pero un rasgo de una dependencia no existe como rasgo propio hasta
# que el paquete lo reexporta: sin esta línea, `cargo build --features
# custom-protocol` responde «the package does not contain this feature». Lo
# calificado —`--features tauri/custom-protocol`— anda igual sin declarar nada,
# y es lo que el CLI de Tauri pasa por su cuenta al hacer `tauri build`; esto es
# para quien compila con cargo a mano.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Los directorios base del estándar: la regla de que una variable relativa o
# vacía se ignora vive ahí y no en una copia acá. Ver `preferencias::archivo`.
dirs = "6"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Los plugins del escritorio. Los cuatro, no dos: una app de VasakOS tiene que
# hablar el idioma de la sesión y abrir el menú del sistema con el clic derecho.
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2"
tauri-plugin-i18n-vsk = "2.3.0"
tauri-plugin-vsk-contextual-menu = "2"
tauri-plugin-shell = "2"
# El diálogo para elegir un archivo que adjuntar. Es Rust puro y habla con el
# portal de XDG por D-Bus, que ya es dependencia: no suma ninguna biblioteca
# compartida al paquete. Es el mismo plugin que usa `vasak-text`, cuyo PKGBUILD
# no declara nada extra por esto.
tauri-plugin-dialog = "2"
# Para codificar el contenido de un adjunto. Es Rust puro.
base64 = "0.22"
# Una sola ventana de correo: abrir la aplicación estando ya abierta levanta la
# que hay. Ver el comentario en `lib.rs`. Es Rust puro —habla por el bus de
# sesión, al que ya estamos conectados— así que no agrega ninguna biblioteca
# compartida al paquete.
tauri-plugin-single-instance = "2"

# Para la ventana sin decoración: la barra propia necesita mover y redimensionar.
gtk = "0.18"
tauri-plugin-vsk-journal = "2"
# Para hablar con vasak-accounts-sync, que es de donde sale el correo. En el bus
# **de sesión**: es un servicio del usuario y lo que publica es suyo.
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
# Para el flujo de señales de D-Bus, que es cómo llega el aviso de correo nuevo.
futures-util = "0.3"

[dev-dependencies]
# Sólo para el test que valida los catálogos de idioma: el plugin los parsea en
# tiempo de ejecución y **paniquea** si no puede, así que un error de sintaxis no
# se ve hasta que la aplicación no arranca.
serde_yaml = "0.9"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Deja que LLVM optimice mirando todo el programa a la vez.
lto = "thin"       # ~90% del beneficio de fat LTO, compilando mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Sin desenrollado de pila: binario más chico y más rápido.
strip = true       # Fuera los símbolos de depuración.

# Ojo al empaquetar: makepkg inyecta `-flto` global en CFLAGS/LDFLAGS, y los
# crates que compilan C o assembly (ring, vía rustls) emiten bitcode que el
# enlazador de rustc no resuelve. El PKGBUILD tiene que llevar `options=('!lto')`
# — Cargo ya hace su propio LTO acá arriba, así que el de makepkg es redundante
# además de dañino.
